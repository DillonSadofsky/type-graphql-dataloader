name: Release

on:
    push:
        tags:
            - "v*"

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            # Install without running dependency lifecycle scripts, so a
            # compromised/malicious transitive dependency can't read NPM_TOKEN
            # off this job's environment. Native builds we actually need
            # (sqlite3, @apollo/protobufjs) are approved in pnpm-workspace.yaml
            # and only needed for tests, which don't run in this job.
            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Build
              run: pnpm run build

            - name: Verify package version matches tag
              run: |
                  PKG_VERSION="v$(node -p "require('./package.json').version")"
                  if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
                    echo "package.json version ($PKG_VERSION) does not match tag ($GITHUB_REF_NAME)"
                    exit 1
                  fi

            - name: Publish to npm
              run: pnpm publish --no-git-checks --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
